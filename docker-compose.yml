# Local development services. Production uses managed equivalents (RDS, ElastiCache, S3, SES).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio: # S3-compatible object storage
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-setup: # creates the private bucket once MinIO is up
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
             mc mb --ignore-existing local/lms-private"
  mailpit: # catches outgoing email locally; UI on :8025
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
  miniodata:
